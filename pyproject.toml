[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mango-call-mvp"
version = "0.1.0"
description = "MVP pipeline: Mango export recordings -> transcript -> analysis -> amoCRM sync"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "openai>=1.70.0",
  "python-dotenv>=1.0.1",
  "requests>=2.32.3",
  "SQLAlchemy>=2.0.36",
  "XlsxWriter>=3.2.9",
  "openpyxl>=3.1.0",
  "google-auth>=2.35.0",
  "pypdf>=6.0.0",
  "PyYAML>=6.0.2",
]

[project.optional-dependencies]
crm = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "pydantic>=2.8.0",
]
analytics = [
  "pandas>=2.2.0",
]
dev = [
  "pytest>=8.3.0",
  "pytest-xdist>=3.6.1",
]

[project.scripts]
mango-mvp = "mango_mvp.cli:main"
mango-mvp-ui = "mango_mvp.gui:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mango_mvp.channels" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "serial: tests with a proven shared-state race under pytest-xdist; run without -n",
]
