classes:
  p0_safety_aggregation_floor:
    bucket: 2_verification
    meaning: Сводит P0-сигналы текущего хода и не даёт понизить уже подтверждённый риск.
    keep: true
    evidence_tests:
    - tests/test_answer_safety_classifier.py
    evidence_cases:
    - tests/test_answer_safety_classifier.py::test_answer_safety_real_p0_recall_matrix_requires_manager_only
  p0_recall_floor:
    bucket: 2_verification
    meaning: Fail-closed распознавание P0, включая деньги, угрозы, жалобы и безопасность ребёнка.
    keep: true
    evidence_tests:
    - tests/test_p0_perifraz.py
    evidence_cases:
    - tests/test_p0_perifraz.py::test_p0_perifraz_reference_cases
  p0_output_hygiene_floor:
    bucket: 2_verification
    meaning: Проверяет готовый ответ на опасные обещания и неверный P0-текст.
    keep: true
    evidence_tests:
    - tests/test_direct_p0_text_hygiene.py
    - tests/test_direct_path_payment_refund_split.py
    evidence_cases:
    - tests/test_direct_p0_text_hygiene.py::test_direct_p0_text_hygiene_provider_level_scrubs_refund_sales_tail
  fact_answer_verification_floor:
    bucket: 2_verification
    meaning: Сверяет содержательный ответ с фактической опорой и запрещает неподтверждённые факты.
    keep: true
    evidence_tests:
    - tests/test_reliable_answerer_step1.py
    evidence_cases:
    - tests/test_reliable_answerer_step1.py::test_availability_promise_is_blocked_by_deterministic_guard
  internal_metadata_leak_floor:
    bucket: 2_verification
    meaning: Не выпускает клиенту служебные идентификаторы, инструкции и внутреннюю разметку.
    keep: true
    evidence_tests:
    - tests/test_subscription_llm_draft_provider.py
    evidence_cases:
    - tests/test_subscription_llm_draft_provider.py::test_provider_strips_internal_manager_note_and_keeps_safe_variant
  brand_money_promise_floor:
    bucket: 2_verification
    meaning: Блокирует смешение брендов, ложное подтверждение оплаты и неподтверждённые числа/обещания.
    keep: true
    evidence_tests:
    - tests/test_brand_boundary.py
    - tests/test_wappi_stabilization_smoke.py
    evidence_cases:
    - tests/test_wappi_stabilization_smoke.py::test_payment_status_is_not_autoconfirmed_without_two_sources
  pii_prompt_scope_floor:
    bucket: 2_verification
    meaning: Не пропускает ПДн в промпт и не позволяет ответу расширить область подтверждённых фактов.
    keep: true
    evidence_tests:
    - tests/test_subscription_llm_draft_provider.py
    evidence_cases:
    - tests/test_subscription_llm_draft_provider.py::test_presale_direct_path_prompt_masks_current_and_recent_pii_but_keeps_child_first_name
  output_claim_pii_floor:
    bucket: 2_verification
    meaning: Проверяет готовый черновик на ПДн, ложные действия, сроки, деньги, записи и неподтверждённые обещания.
    keep: true
    evidence_tests:
    - tests/test_subscription_llm_draft_provider.py
    - tests/test_output_verification_floor_regressions.py
    evidence_cases:
    - tests/test_subscription_llm_draft_provider.py::test_a2_gate_blocks_fake_enrollment_and_pii_echo_when_flagged
  fact_pii_verification_floor:
    bucket: 2_verification
    meaning: Сверяет числа и формулировки с фактами и маскирует контактные данные.
    keep: true
    evidence_tests:
    - tests/test_output_verification_floor_regressions.py
    evidence_cases:
    - tests/test_output_verification_floor_regressions.py::test_verify_output_blocks_named_entity_not_in_current_facts
  semantic_frame_pii_floor:
    bucket: 2_verification
    meaning: Маскирует длинные идентификаторы в безопасном представлении SemanticFrame.
    keep: true
    evidence_tests:
    - tests/test_subscription_llm_draft_provider.py
    evidence_cases:
    - tests/test_subscription_llm_draft_provider.py::test_direct_path_output_sanitizer_removes_client_phone_and_child_name_echo
  memory_safety_floor:
    bucket: 2_verification
    meaning: Не даёт памяти превратить старый риск, число или обещание в неподтверждённый клиентский факт.
    keep: true
    evidence_tests:
    - tests/test_dialogue_memory.py
    evidence_cases:
    - tests/test_dialogue_memory.py::test_dialogue_summary_rolling_rejects_unsafe_candidates
  output_whitespace_normalization:
    bucket: 3_format_hygiene
    meaning: Исправляет пробелы, пустые строки и пробелы перед пунктуацией без выбора смысла.
    keep: true
  output_format_hygiene:
    bucket: 3_format_hygiene
    meaning: Убирает технические префиксы, разделители, метки и эмодзи без выбора бизнес-смысла.
    keep: true
  parser_normalization:
    bucket: 3_format_hygiene
    meaning: Разбирает JSON, служебные ключи и роли сообщений; не классифицирует запрос клиента.
    keep: true
  fact_text_normalization:
    bucket: 3_format_hygiene
    meaning: Нормализует техническую оболочку текста факта без выбора самого факта.
    keep: true
  refund_semantic_safety_floor:
    bucket: 2_verification
    meaning: 'Semantic classifier used only as a safety boundary for refund/P0 split: it separates a benign policy or tax
      question from an actual money dispute.'
    keep: true
    evidence_tests:
    - tests/test_semantic_roles.py
    - tests/test_answer_safety_classifier.py
    evidence_cases:
    - tests/test_semantic_roles.py::test_tax_deduction_return_word_is_not_payment_refund
  legacy_model_owned_semantics:
    bucket: 1_model_owned_semantics
    meaning: До основной модели определяет намерение, тему, действие или отбор фактов; подлежит переносу к существующей модели.
    keep: false
  fact_output_verification_floor:
    bucket: 2_verification
    meaning: После модельного решения проверяет опору, область факта, маршрут или безопасное понижение; смысл запроса не выбирает.
    keep: true
    evidence_tests:
    - tests/test_output_verification_floor_regressions.py
    evidence_cases:
    - tests/test_output_verification_floor_regressions.py::test_verify_output_blocks_named_entity_not_in_current_facts
  technical_parser_or_lookup:
    bucket: 4_technical_parser_or_lookup
    meaning: Разбирает явное структурное значение или протокол и не выбирает бизнес-смысл свободного текста.
    keep: true
  historical_measurement_only:
    bucket: 5_historical_measurement_only
    meaning: Не участвует в рабочем ответе и остаётся только частью воспроизводимого исторического измерителя.
    keep: true
