lvsh_podlipki_2026:
  format: Дополнительная летняя выездная физико-математическая школа УНПК МФТИ с проживанием.
  location: Санаторий-профилакторий «Подлипки» РКК «Энергия», Московская область, Королёв, улица Северная, 15Б.
  dates: 16–26 августа 2026 года; заезд в воскресенье.
  audience: 5–10 классы; группа 10 класса открывается после подтверждения достаточного набора.
  direction: Физико-математическое направление.
  accommodation: По 2 человека в номере.
  meals: 5-разовое питание, шведский стол.
  climate: Кондиционеров нет; на окнах вентиляционные устройства, в помещениях прохладно.
  transfer: Организованный трансфер из Москвы; ориентир — Медведково или Бабушкинская, точные место и время сообщаются позже.
  medical_support: На территории есть отдельный медблок с врачами.
  venue: Зелёная территория, домики, беседки, асфальтированные дорожки и спортплощадки; обучение проходит в переговорных, кабинетах и домиках.
  capacity: Ориентировочно 120–150 детей.
  base_price: 130000
  enrollment: Набор открыт; место в конкретной группе подтверждает менеджер.
internal_only:
  minimum_agreed_price: 114000
  fast_sale_discount_percent: 5
  individual_discount_percent_options: [5, 10, 15]
  do_not_promise:
  - точное место и время трансфера
  - конкретный учебный кабинет или корпус
  - открытие 10 класса до подтверждения набора
  - наличие кондиционера
  - цену ниже согласованной без решения менеджера
